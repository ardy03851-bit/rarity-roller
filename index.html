<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Rarity Roller — a minimal RNG game. Roll, discover rarities from Common to Divine." />
  <title>Rarity Roller</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2360a5fa'/%3E%3Cstop offset='1' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='5' y='5' width='14' height='14' rx='3' transform='rotate(45 12 12)' fill='url(%23g)'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Audiowide&family=Bebas+Neue&family=Bungee&family=Chakra+Petch:wght@600;700&family=Cinzel:wght@600;800&family=Cormorant+Garamond:wght@700&family=Creepster&family=Fraunces:wght@700;900&family=Fredoka:wght@600;700&family=Grenze+Gotisch:wght@700;900&family=Josefin+Sans:wght@600;700&family=Major+Mono+Display&family=MedievalSharp&family=Michroma&family=Monoton&family=Nosifer&family=Orbitron:wght@700;900&family=Permanent+Marker&family=Playfair+Display:wght@700;900&family=Poiret One&family=Press Start 2P&family=Righteous&family=Rubik+Mono+One&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@500;700&family=Syncopate:wght@700&family=Syne:wght@700;800&family=Unbounded:wght@500;700;800&family=Zen+Dots&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/rarity.css" />
  <link rel="stylesheet" href="css/ui.css" />
</head>
<body>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div id="flash-layer" aria-hidden="true"></div>

  <header class="bar">
    <h1 class="wordmark">Rarity&nbsp;Roller</h1>
    <div class="bar-right">
      <div class="stat-chip">
        <span class="stat-label">Rolls</span>
        <b id="stat-total">0</b>
      </div>
      <div class="stat-chip" id="stat-best-wrap">
        <span class="stat-label">Best</span>
        <b id="stat-best">—</b>
      </div>
      <button id="sound-toggle" class="icon-btn" aria-label="Toggle sound" aria-pressed="true">
        <svg class="ic ic-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <svg class="ic ic-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <!-- ============ ROLL ============ -->
    <section id="view-roll" class="view active" aria-label="Roll">
      <div class="stage">
        <div class="stage-icon" id="stage-icon" aria-hidden="true"></div>
        <div class="stage-name" id="stage-name" aria-live="polite"></div>
        <div class="dissolve-veil" id="dissolve-veil" aria-hidden="true"></div>
        <div class="stage-meta" id="stage-meta"></div>
      </div>

      <button id="roll-btn" class="roll-btn" type="button">
        <span class="roll-label">Roll</span>
      </button>
    </section>

    <!-- ============ INVENTORY ============ -->
    <section id="view-inventory" class="view" aria-label="Inventory">
      <div class="view-head">
        <h2>Inventory</h2>
        <p class="view-sub">Your collection is saved on this device.</p>
      </div>
      <div id="inv-grid" class="inv-grid"></div>
    </section>

    <!-- ============ CHANGELOG ============ -->
    <section id="view-changelog" class="view" aria-label="Changelog">
      <div class="view-head">
        <h2>Changelog</h2>
        <p class="view-sub">Rarity names carry their own animations.</p>
      </div>
      <div id="changelog" class="changelog"></div>
    </section>

    <!-- ============ STYLES ============ -->
    <section id="view-styles" class="view" aria-label="Button styles">
      <div class="view-head">
        <h2>Styles</h2>
        <p class="view-sub">Button styles you unlock just by playing.</p>
      </div>
      <div id="styles-list" class="styles-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- ============ TABS ============ -->
  <button id="tabs-toggle" class="tabs-toggle" aria-label="Open tab menu" aria-expanded="false" aria-controls="tabs-menu">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </button>

  <nav id="tabs-menu" class="tabs-menu" aria-hidden="true" aria-label="Tab navigation">
    <button class="tab-btn" data-tab="roll" aria-current="page">Roll</button>
    <button class="tab-btn" data-tab="inventory">Inventory</button>
    <button class="tab-btn" data-tab="changelog">Changelog</button>
    <button class="tab-btn" data-tab="styles">Styles</button>
  </nav>

  <!-- html2canvas for the voxel tab transition (vendored copy, CDN fallback) -->
  <script src="js/vendor/html2canvas.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'"></script>
  <script src="js/engine.js"></script>
  <script src="js/rarities.config.js"></script>
  <script src="js/rarities.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/changelog.js"></script>
  <script src="js/styles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
